<div class="tools-grid" style="margin-top: 14px;">

        <div class="tool-icon-wrapper">
            <i class="fa-brands fa-youtube"></i>
        </div>
        <span class="tool-title">YouTube Downloader</span>
        <span class="tool-desc">Download video/audio</span>
    </div>

    <div onclick="openTool('tt')" class="tool-card">
        <div class="tool-icon-wrapper">
            <i class="fa-brands fa-tiktok"></i>
        </div>
        <span class="tool-title">TikTok Downloader</span>
        <span class="tool-desc">Tanpa watermark</span>
    </div>

    <div onclick="openTool('deepl')" class="tool-card">
        <div class="tool-icon-wrapper">
            <i class="fa-solid fa-language"></i>
        </div>
        <span class="tool-title">Terjemahan</span>
        <span class="tool-desc">Anti kaku & akurat</span>
    </div>

    <div onclick="shareApi(event)" class="tool-card">
        <div class="tool-icon-wrapper">
            <i class="fa-solid fa-share-nodes"></i>
        </div>
        <span class="tool-title">Share Web Gw</span>
        <span class="tool-desc">Bagikan fitur ini</span>
    </div>
