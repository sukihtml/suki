<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katalog - Suki Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #060608;
            --card-bg: rgba(18, 18, 22, 0.75);
            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-gold: rgba(197, 160, 89, 0.3);
            --accent-gold: #C5A059;
            --accent-gold-light: #E5C178;
            --text-primary: #F5F5F7;
            --text-secondary: #8E8E93;
            --text-muted: #636366;
            --danger: #FF453A;
            --success: #32D74B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 50% 0%, rgba(197, 160, 89, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(20, 20, 25, 0.5) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            position: relative;
            z-index: 1;
            padding-bottom: 90px;
        }

        .catalog-header {
            padding: 42px 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .catalog-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .catalog-header i {
            color: var(--accent-gold);
            font-size: 0.95rem;
        }

        .catalog-header h2 {
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .catalog-tag {
            font-size: 0.6rem;
            background: rgba(197, 160, 89, 0.12);
            color: var(--accent-gold-light);
            border: 1px solid var(--border-gold);
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
        }

        .product-grid {
            padding: 0 14px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .product-img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            position: relative;
            background: #121215;
        }

        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-size: 0.68rem;
            font-weight: 600;
            line-height: 1.3;
            height: 2.6em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text-primary);
        }

        .product-price {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-gold);
            margin: 4px 0 6px;
        }

        .product-actions {
            display: flex;
            gap: 4px;
            margin-top: auto;
        }

        .btn-action-cart {
            border: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border-radius: 6px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.65rem;
        }

        .btn-action-buy {
            flex: 1;
            height: 24px;
            background: var(--text-primary);
            color: #000;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 700;
            text-decoration: none;
        }

        .skeleton {
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
        }

        .skeleton::after {
            content: "";
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        .skel-img { aspect-ratio: 1/1; width: 100%; border-radius: 0; }
        .skel-line { height: 10px; width: 80%; margin: 6px 6px 0; }
        .skel-line.short { width: 50%; margin-top: 4px; margin-bottom: 6px; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="catalog-header">
            <div class="catalog-title-group">
                <i class="fa-solid fa-layer-group"></i>
                <h2>Katalog Suki</h2>
            </div>
        </div>
        
        <section class="product-grid" id="productGrid">
            <div class="product-card skel-card" style="display: none;">
                <div class="skeleton skel-img"></div>
                <div class="skeleton skel-line"></div>
                <div class="skeleton skel-line short"></div>
            </div>
            <div class="product-card skel-card" style="display: none;">
                <div class="skeleton skel-img"></div>
                <div class="skeleton skel-line"></div>
                <div class="skeleton skel-line short"></div>
            </div>
            <div class="product-card skel-card" style="display: none;">
                <div class="skeleton skel-img"></div>
                <div class="skeleton skel-line"></div>
                <div class="skeleton skel-line short"></div>
            </div>
            
            <div class="product-card real-product" style="display: flex; animation: 0.4s ease 0.08s 1 normal forwards running fadeUp;">
                <div class="product-img-wrapper">
                    <img src="Profil admin/Profil webstore.png" alt="Suki" class="">
                </div>
                <div class="product-info">
                    <h3 class="product-title">Jasa Pembuatan WebStore</h3>
                    <p class="product-price">Gratis</p>
                    <div class="product-actions">
                        <button class="btn-action-cart" disabled="" style="cursor: not-allowed; pointer-events: none; opacity: 0.5;" onclick="return false;"><i class="fa-solid fa-plus"></i></button>
                        <a href="https://wa.me/iamsukiwir" target="_blank" class="btn-action-buy">Beli</a>
                    </div>
                </div>
            </div>

            <div class="product-card real-product" style="display: flex; animation: 0.4s ease 0.16s 1 normal forwards running fadeUp;">
                <div class="product-img-wrapper">
                    <img src="Profil admin/Profil design logo.png" alt="Suki" class="">
                </div>
                <div class="product-info">
                    <h3 class="product-title">Jasa Design Logo anime</h3>
                    <p class="product-price">Gratis</p>
                    <div class="product-actions">
                        <button class="btn-action-cart" disabled="" style="cursor: not-allowed; pointer-events: none; opacity: 0.5;" onclick="return false;"><i class="fa-solid fa-plus"></i></button>
                        <a href="https://wa.me/iamsukiwir" target="_blank" class="btn-action-buy">Beli</a>
                    </div>
                </div>
            </div>
        </section>

        <div class="catalog-header">
            <div class="catalog-title-group">
                <i class="fa-solid fa-gamepad"></i>
                <h2>Katalog Game</h2>
            </div>
        </div>
        
        <section class="product-grid">
            <div class="product-card real-product" style="display: flex; animation: 0.4s ease 0.08s 1 normal forwards running fadeUp;">
                <div class="product-img-wrapper">
                    <img src="Profil game/Tictactoe pro.jpg" alt="Tictactoe pro" class="">
                </div>
                <div class="product-info">
                    <h3 class="product-title">Tictactoe pro</h3>
                    <div class="product-actions">
                        <a href="Game/Tictactoe pro.html" class="btn-action-buy">Play</a>
                    </div>
                </div>
            </div>

            <div class="product-card real-product" style="display: flex; animation: 0.4s ease 0.16s 1 normal forwards running fadeUp;">
                <div class="product-img-wrapper">
                    <img src="Profil game/balap suki.jpg" alt="Balap suki" class="">
                </div>
                <div class="product-info">
                    <h3 class="product-title">Balap suki</h3>
                    <div class="product-actions">
                        <a href="Game/Balap suki.html" class="btn-action-buy">Play</a>
                    </div>
                </div>
            </div>

            <div class="product-card real-product" style="display: flex; animation: 0.4s ease 0.24s 1 normal forwards running fadeUp;">
                <div class="product-img-wrapper">
                    <img src="Profil game/Suki plane 2.jpg" alt="Suki plane 2" class="">
                </div>
                <div class="product-info">
                    <h3 class="product-title">Suki plane 2</h3>
                    <div class="product-actions">
                        <a href="Game/Suki plane 2.html" class="btn-action-buy">Play</a>
                    </div>
                </div>
            </div>
        </section>

        <div class="catalog-header">
            <div class="catalog-title-group">
                <i class="fa-solid fa-users"></i>
                <h2>Katalog Member</h2>
            </div>
        </div>
        
        <section class="product-grid">
            <div class="product-card real-product" style="display: flex; animation: 0.4s ease 0.08s 1 normal forwards running fadeUp;">
                <div class="product-img-wrapper">
                    <img src="profil member/suki.png" alt="Member 1" class="">
                </div>
                <div class="product-info">
                    <h3 class="product-title">Member 1</h3>
                    <div class="product-actions">
                        <a href="member/member1.html" class="btn-action-buy">Kunjungi</a>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
