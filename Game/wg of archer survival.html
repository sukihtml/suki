<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const PI=Math.PI,TAU=PI*2,M=Math;
let W,H,sc,VW,VH,GY,dd,T=0,DT=.016,cam=0,shake=0,gBg,gFg,gGr;
function rs(){
dd=M.min(devicePixelRatio||1,1.6);W=innerWidth;H=innerHeight;
cv.width=W*dd;cv.height=H*dd;
sc=M.max(.55,M.min(1.5,H/520,W/600));

const hs=n=>{const s=M.sin(n*127.1+311.7)*43758.5453;return s-M.floor(s)};
const lr=(a,b,t)=>a+(b-a)*t;

const K={},TT={};
const KM={l:['KeyA','ArrowLeft'],r:['KeyD','ArrowRight'],j:['KeyW','ArrowUp','Space'],f:['KeyJ','KeyF'],s:['KeyK','KeyS','ArrowDown']};
const inp=n=>!p.dead&&(KM[n].some(c=>K[c])||TT[n]);
addEventListener('keydown',e=>{K[e.code]=1;if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault()});
addEventListener('keyup',e=>{K[e.code]=0});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{if(e.pointerType!='mouse')return;if(e.button==0)TT.f=1;if(e.button==2)TT.s=1});
addEventListener('pointerup',e=>{if(e.pointerType!='mouse')return;if(e.button==0)TT.f=0;if(e.button==2)TT.s=0});

const bt=[...document.querySelectorAll('.b')].map(el=>({el,k:el.dataset.k,x:0,y:0,r:0}));
const ptr=new Map();
function mb(){
for(const b of bt){const r=b.el.getBoundingClientRect();b.x=r.left+r.width/2;b.y=r.top+r.height/2;b.r=r.width/2+12}
}
function hit(x,y){
let o=null,bd=1e9;
for(const b of bt){const d=M.hypot(x-b.x,y-b.y);if(d<b.r&&d<bd){bd=d;o=b}}
return o;
}
function sync(){
const on=new Set(ptr.values());
for(const b of bt){const v=on.has(b)?1:0;TT[b.k]=v;b.el.classList.toggle('on',!!v)}
}
function put(id,b){if(ptr.get(id)!==b){ptr.set(id,b);sync()}}
addEventListener('pointerdown',e=>{if(e.pointerType=='mouse')return;mb();put(e.pointerId,hit(e.clientX,e.clientY))});
addEventListener('pointermove',e=>{if(e.pointerType!='mouse'&&ptr.has(e.pointerId))put(e.pointerId,hit(e.clientX,e.clientY))});
const rel=e=>{if(ptr.delete(e.pointerId))sync()};
addEventListener('pointerup',rel);addEventListener('pointercancel',rel);
addEventListener('blur',()=>{for(const k in K)K[k]=0;for(const k in TT)TT[k]=0;ptr.clear();sync()});

function mk(c){
const o=document.createElement('canvas');o.width=o.height=64;
const x=o.getContext('2d'),r=x.createRadialGradient(32,32,0,32,32,32);
r.addColorStop(0,'rgba('+c+',1)');r.addColorStop(.35,'rgba('+c+',.35)');r.addColorStop(1,'rgba('+c+',0)');
x.fillStyle=r;x.fillRect(0,0,64,64);return o;
}
const GL={a:mk('255,196,110'),c:mk('150,190,225'),w:mk('255,255,255'),g:mk('176,226,176'),r:mk('205,100,88'),p:mk('236,214,170'),v:mk('160,140,195')};
function gl(k,x,y,r,a){
g.globalCompositeOperation='lighter';g.globalAlpha=M.max(0,M.min(1,a));
g.drawImage(GL[k],x-r,y-r,r*2,r*2);
g.globalAlpha=1;g.globalCompositeOperation='source-over';
}

function ik(x0,y0,x1,y1,a,b,s){
const dx=x1-x0,dy=y1-y0;
const d=M.min(M.hypot(dx,dy)||.001,a+b-.01);
const an=M.atan2(dy,dx);
const ck=(a*a+d*d-b*b)/(2*a*d);
const ak=M.acos(M.max(-1,M.min(1,ck)))*s;
return[x0+M.cos(an+ak)*a,y0+M.sin(an+ak)*a,x0+M.cos(an)*d,y0+M.sin(an)*d];
}

function sl(x0,y0,x1,y1,c,w){g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke()}
function ov(x,y,rx,ry,c,r){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,r||0,0,TAU);g.fill()}
function poly(a,f,s,w){
g.beginPath();g.moveTo(a[0],a[1]);
for(let i=2;i<a.length;i+=2)g.lineTo(a[i],a[i+1]);
g.closePath();
if(f){g.fillStyle=f;g.fill()}
if(s){g.strokeStyle=s;g.lineWidth=w||1;g.stroke()}
}
function claws(x,y,a,c,l){
g.strokeStyle=c;g.lineWidth=1.1;g.lineCap='round';
for(let k=-1;k<=1;k++){const b=a+k*.38;g.beginPath();g.moveTo(x,y);g.lineTo(x+M.cos(b)*l,y+M.sin(b)*l);g.stroke()}
}
function limb(hx,hy,fx,fy,kb,c1,c2,w){
const dx=fx-hx,dy=fy-hy,d=M.hypot(dx,dy)||1;
let nx=dy/d,ny=-dx/d;
if(nx<0){nx=-nx;ny=-ny}
const kx=(hx+fx)*.5+nx*kb,ky=(hy+fy)*.5+ny*kb;
g.lineCap='round';g.lineJoin='round';
g.strokeStyle=c1;g.lineWidth=6.2*w;g.beginPath();g.moveTo(hx,hy);g.lineTo(kx,ky);g.stroke();
g.lineWidth=4.8*w;g.beginPath();g.moveTo(kx,ky);g.lineTo(fx,fy);g.stroke();
g.strokeStyle=c2;g.lineWidth=5.4*w;g.beginPath();g.moveTo(lr(kx,fx,.55),lr(ky,fy,.55));g.lineTo(fx,fy);g.stroke();
g.lineWidth=4.6*w;g.beginPath();g.moveTo(fx-1,fy);g.lineTo(fx+4.5*w,fy);g.stroke();
return[kx,ky];
}
function stepLeg(q,sn,hx,hy,c1,c2,w){
const x=M.sin(q)*12*sn+(hx<0?-3:3)*(1-sn),y=-M.max(0,M.cos(q))*5.5*sn-2.3;
return limb(hx,hy,x,y,.6+M.max(0,-2.3-y)*.3,c1,c2,w);
}
function cape(len,c,e,cs,cw,fr){
g.fillStyle=c;g.beginPath();g.moveTo(-3,-20);
g.quadraticCurveTo(-8-cs*.6,-8,-9-cs+cw,len);
if(fr){
for(let k=1;k<=4;k++){const t=k/4;g.lineTo(lr(-9-cs+cw,3,t),len+(k&1?-2.4:1.2)+M.sin(T*3+k)*.8)}
}else g.quadraticCurveTo(-2+cw*.5,len+2.5,3,len-.5);
g.lineTo(4.5,-17);g.closePath();g.fill();
g.strokeStyle=e;g.lineWidth=.9;g.stroke();
}
function sarm(col,hand,th,L,shy){
const r=ik(1.5,shy,1.5+M.cos(th)*L,shy+M.sin(th)*L,11,11,1);
g.lineCap='round';g.lineJoin='round';g.strokeStyle=col;g.lineWidth=4.6;
g.beginPath();g.moveTo(1.5,shy);g.lineTo(r[0],r[1]);g.lineTo(r[2],r[3]);g.stroke();
g.fillStyle=hand;g.beginPath();g.arc(r[2],r[3],2.4,0,TAU);g.fill();
return r;
}

const P=[],A=[];
function sp(t,x,y,vx,vy,l,r,c,gv,dg){
if(P.length>160&&t!=2&&t!=4)return;
P.push({t,x,y,vx,vy,l,m:l,r,c,gv:gv||0,dg:dg||0});
}
const ring=(x,y,c,r)=>sp(2,x,y,0,0,.4,r,c);
const arc=(x,y,d,r,c)=>P.push({t:4,x,y,vx:d,vy:0,l:.2,m:.2,r,c,gv:0,dg:0});
function dust(x,y,n,s){for(let i=0;i<n;i++)sp(0,x+rnd(-4,4),y-1,rnd(-1,1)*s,rnd(-.5,-.1)*s,rnd(.35,.7),rnd(2,4),'150,160,175',-20,2.5)}
function upP(dt){
for(let i=P.length-1;i>=0;i--){
const q=P[i];q.l-=dt;
if(q.l<=0){P.splice(i,1);continue}
q.vx-=q.vx*q.dg*dt;q.vy-=q.vy*q.dg*dt;q.vy+=q.gv*dt;
q.x+=q.vx*dt;q.y+=q.vy*dt;
if(q.t==3&&q.y>GY){q.y=GY;q.vy*=-.3;q.vx*=.6}
}
}
function drawPt(){
for(const q of P){
const k=q.l/q.m;
if(q.t==0){
g.globalAlpha=k*.3;g.fillStyle='rgb('+q.c+')';
g.beginPath();g.arc(q.x,q.y,q.r*(1+(1-k)*1.3),0,TAU);g.fill();
}else if(q.t==1){
gl(q.c,q.x,q.y,q.r*(.5+k*.5),k*.9);
}else if(q.t==2){
g.globalCompositeOperation='lighter';g.globalAlpha=k*.6;
g.strokeStyle='rgb('+q.c+')';g.lineWidth=.6+k*2;
g.beginPath();g.arc(q.x,q.y,q.r*(1-k*k),0,TAU);g.stroke();
g.globalCompositeOperation='source-over';
}else if(q.t==4){
g.save();g.translate(q.x,q.y);g.scale(q.vx<0?-1:1,1);
g.globalAlpha=k*.8;g.strokeStyle='rgb('+q.c+')';g.lineCap='round';
g.lineWidth=.8+k*3.4;
g.beginPath();g.arc(-q.r*.35,0,q.r*(1.05-k*.12),-1.05,1.05);g.stroke();
g.restore();
}else if(q.t==5){
g.globalAlpha=k*.75;g.fillStyle='rgb('+q.c+')';
g.beginPath();g.arc(q.x,q.y,q.r*(.5+k*.5),0,TAU);g.fill();
}else{
g.globalCompositeOperation='lighter';g.globalAlpha=k;
g.strokeStyle='rgb('+q.c+')';g.lineWidth=q.r*k+.4;g.lineCap='round';
g.beginPath();g.moveTo(q.x,q.y);g.lineTo(q.x-q.vx*.035,q.y-q.vy*.035);g.stroke();
g.globalCompositeOperation='source-over';
}
}
g.globalAlpha=1;
}

const p={x:0,y:0,vx:0,vy:0,f:1,on:1,wk:0,st:0,ch:0,pc:0,dr:0,da:0,sh:0,sf:0,rc:0,sq:0,cy:0,jb:0,cd:0,air:0,idle:0,mt:0,bl:3,wd:-1,wj:0,ws:0,hp:100,mh:100,hu:0,inv:0,dead:0,rg:0};
p.y=GY;cam=-VW*.5;

function fire(){
const c=M.max(.18,p.ch),s=480+c*760,a=-.07-(1-c)*.04,d=p.f;
A.push({x:p.x+d*26,y:p.y-45,vx:d*M.cos(a)*s,vy:M.sin(a)*s,tr:[],st:0,l:0,c,an:d>0?a:PI-a,dm:16+c*44,pr:c>.85?2:0,hit:[]});
p.dr=0;p.ch=0;p.pc=0;p.cd=.2;p.rc=1;shake=M.max(shake,1+c*3);
for(let i=0;i<8;i++){const b=rnd(-.5,.5);sp(3,p.x+d*28,p.y-45,d*M.cos(b)*rnd(120,360)*c+d*60,M.sin(b)*rnd(120,300)*c,rnd(.2,.4),2,'255,205,130',500,2)}
ring(p.x+d*30,p.y-45,'255,205,130',22+c*22);
sp(1,p.x+d*30,p.y-45,0,0,.2,50,'a');
}

function upd(dt){
const L=inp('l'),R=inp('r'),J=inp('j'),F=inp('f'),S=inp('s'),dir=(R?1:0)-(L?1:0);
p.cd-=dt;
if(S&&!p.ws){
p.sf=1;ring(p.x+p.f*18,p.y-30,'150,195,225',30);
for(let i=0;i<7;i++){const a=rnd(-1,1);sp(3,p.x+p.f*30,p.y-30+a*14,p.f*rnd(40,140),a*90,rnd(.25,.45),1.6,'165,205,230',200,2)}
}
if(S){p.dr=0;p.ch=0}
else if(F){
if(!p.dr&&p.cd<=0){p.dr=1;p.ch=0}
if(p.dr)p.ch=M.min(1,p.ch+dt/.7);
}else if(p.dr)fire();
p.da+=((p.dr?1:0)-p.da)*M.min(1,dt*16);
if(p.dr){
const nx=p.x+p.f*24,ny=p.y-45;
if(p.ch>.2&&M.random()<p.ch*.5){const a=rnd(0,TAU),r=rnd(18,30);sp(1,nx+M.cos(a)*r,ny+M.sin(a)*r,-M.cos(a)*r*3.2,-M.sin(a)*r*3.2,.3,7,'a')}
if(p.pc<1&&p.ch>=1)ring(nx,ny,'255,205,130',24);
p.pc=p.ch;
}
if(dir&&!p.dr)p.f=dir;
p.wd+=(-p.f-p.wd)*M.min(1,dt*1.5);
p.sh+=((S?1:0)-p.sh)*M.min(1,dt*13);
const spd=200*(p.dr?.42:1)*(1-p.sh*.45);
p.vx+=(dir*spd-p.vx)*M.min(1,dt*(p.on?(dir?13:11):4));
if(J&&!p.wj)p.jb=.13;else p.jb-=dt;
p.cy=p.on?.1:p.cy-dt;
if(p.jb>0&&p.cy>0){p.vy=-560;p.on=0;p.cy=0;p.jb=0;p.sq=-.3;dust(p.x,GY,6,60)}
if(!p.on){
let gr=1700;
if(p.vy<0&&!J)gr*=2.3;else if(p.vy>0)gr*=1.12;
p.vy=M.min(950,p.vy+gr*dt);p.y+=p.vy*dt;
if(p.y>=GY){p.y=GY;if(p.vy>260){p.sq=M.min(.4,p.vy/2400);dust(p.x,GY,8,90)}p.vy=0;p.on=1}
}else p.y=GY;
p.x+=p.vx*dt;
const sn=M.min(1,M.abs(p.vx)/190);
if(p.on){
p.wk+=M.abs(p.vx)*dt*.085;
const s=M.floor(p.wk/PI);
if(s!=p.st){p.st=s;if(sn>.3)dust(p.x-p.f*4,GY,2,40)}
}
p.air+=((p.on?0:1)-p.air)*M.min(1,dt*16);
p.sq*=M.exp(-dt*9);p.rc*=M.exp(-dt*8);p.sf*=M.exp(-dt*3.2);
p.wj=J;p.ws=S;
if(!dir&&p.on&&!p.dr&&!S&&M.abs(p.vx)<5)p.idle+=dt;else p.idle=0;
p.mt-=dt;
if(p.idle>1&&p.mt<=0){p.mt=rnd(.25,.5);sp(1,p.x+rnd(-14,14),p.y-rnd(10,50),rnd(-4,4),rnd(-16,-8),rnd(1.4,2.4),rnd(5,9),'a')}
p.bl-=dt;if(p.bl<-.12)p.bl=rnd(2.2,5);
}

function upA(dt){
for(let i=A.length-1;i>=0;i--){
const a=A[i];
if(!a.st){
a.tr.push({x:a.x,y:a.y});if(a.tr.length>16)a.tr.shift();
a.vy+=430*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.an=M.atan2(a.vy,a.vx);
if(hitA(a)){A.splice(i,1);continue}
if(M.random()<.6)sp(1,a.x-a.vx*.01,a.y-a.vy*.01,rnd(-8,8),rnd(-8,8),.3,8+a.c*6,'a');
if(a.c>.5&&M.random()<.5)sp(5,a.x-a.vx*.02,a.y-a.vy*.02,rnd(-24,24),rnd(-24,24),rnd(.3,.5),1.5,'236,200,140',60,2);
if(a.y>=GY){
a.y=GY+rnd(1,4);a.st=1;a.l=0;dust(a.x,GY,5,70);ring(a.x,GY,'255,205,130',16);
for(let k=0;k<6;k++)sp(3,a.x,GY-1,rnd(-90,90),rnd(-200,-60),rnd(.25,.5),1.8,'255,205,130',600,1.5);
shake=M.max(shake,.8);
}else if(M.abs(a.x-p.x)>3000)A.splice(i,1);
}else{
a.l+=dt;if(a.tr.length)a.tr.shift();
if(a.l>4.2)A.splice(i,1);
}
}
}
function drawA(){
for(const a of A){
const fade=a.st?M.min(1,(4.2-a.l)/.8):1;
g.lineCap='round';g.globalCompositeOperation='lighter';g.strokeStyle='rgb(255,200,120)';
for(let i=1;i<a.tr.length;i++){
const k=i/a.tr.length;
g.globalAlpha=k*.4*fade;g.lineWidth=.8+k*2.2;
g.beginPath();g.moveTo(a.tr[i-1].x,a.tr[i-1].y);g.lineTo(a.tr[i].x,a.tr[i].y);g.stroke();
}
g.globalCompositeOperation='source-over';g.globalAlpha=1;
if(!a.st)gl('a',a.x,a.y,11+a.c*6,.4);
g.save();g.translate(a.x,a.y);
g.rotate(a.an+(a.st?M.sin(a.l*45)*M.exp(-a.l*7)*.1:0));
g.globalAlpha=fade;
g.strokeStyle='#b8a07a';g.lineWidth=1.6;
g.beginPath();g.moveTo(-30,0);g.lineTo(-3,0);g.stroke();
g.strokeStyle='rgba(255,240,210,.35)';g.lineWidth=.6;
g.beginPath();g.moveTo(-28,-.5);g.lineTo(-4,-.5);g.stroke();
g.fillStyle='#d9dfe8';
g.beginPath();g.moveTo(3,0);g.lineTo(-4,-2.6);g.lineTo(-3,0);g.lineTo(-4,2.6);g.closePath();g.fill();
g.fillStyle='#8fb3a8';
g.beginPath();g.moveTo(-30,0);g.lineTo(-35,-3);g.lineTo(-27,-.5);g.lineTo(-27,.5);g.lineTo(-35,3);g.closePath();g.fill();
g.fillStyle='#b9d1c8';
g.beginPath();g.moveTo(-27,0);g.lineTo(-32,-2.4);g.lineTo(-24,-.4);g.lineTo(-24,.4);g.lineTo(-32,2.4);g.closePath();g.fill();
g.restore();
}
g.globalAlpha=1;
}

const SF=[];
for(let i=0;i<8;i++)SF.push({x:0,y:0,ox:0,oy:0});
